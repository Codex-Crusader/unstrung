[package]
name = "unstrung-core"
description = "Core service for Unstrung: database, chat engine adapter and chat logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = { version = "0.4", features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
win32job = "2"
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
