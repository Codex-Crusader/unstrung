[package]
name = "unstrung-core"
description = "Core service for Unstrung: database, chat engine adapter and chat logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = { version = "0.4", features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
sha2 = "0.11"
aes-gcm = "0.11"
hkdf = "0.13"
getrandom = "0.4"
zip = { version = "9.2", default-features = false, features = ["deflate-flate2"] }
# zip needs a flate2 backend; the pure Rust one is already in the build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.2"
# The chats file is encrypted with SQLCipher. Same version as sqlx uses, so
# the feature reaches its SQLite. OpenSSL is built from source (needs Perl).
# Windows only: the app ships only there, and the Linux fuzz job needs no
# OpenSSL build.
libsqlite3-sys = { version = "=0.30.1", features = ["bundled-sqlcipher-vendored-openssl"] }
win32job = "2"
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
