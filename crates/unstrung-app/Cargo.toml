[package]
name = "unstrung-app"
description = "Desktop shell for Unstrung."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["isolation"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time", "fs", "net"] }
unstrung-core.workspace = true

# Windows only, without the Linux portal and GTK backends, which pull in
# crates that cargo audit flags as unmaintained.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
tauri-winrt-notification = "0.8"
winreg = "0.56"

[build-dependencies]
tauri-build = { version = "2.5", features = ["isolation"] }
