# cargo-deny: licenses, known bugs, banned crates and sources.
# Rule 5 of the project: permissive licenses only. No GPL, LGPL or AGPL.

[graph]
all-features = true
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
ignore = [
    # SQLite before 3.54 with a crafted database and -wal pair. Unstrung opens
    # only database files that it wrote: a backup import stages the chats file
    # as app.db and never extracts another file next to it, Move folder needs
    # an empty folder, and a swap deletes old -wal and -shm files. sqlx 0.8
    # pins libsqlite3-sys 0.30, and the SQLCipher build of 0.39 still has
    # SQLite 3.53. Remove this when sqlx and SQLCipher ship SQLite 3.54.
    { id = "RUSTSEC-2026-0459", reason = "Unstrung opens only database files that it wrote, and no fixed SQLCipher exists yet" },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
# MPL-2.0 is file-level copyleft. Tauri needs these crates, and we use them unchanged.
# Each one is named, so a new MPL-2.0 dependency fails the check until someone reviews it.
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "tauri-plugin-shell", reason = "no shell access from the UI" },
    { crate = "tauri-plugin-fs", reason = "no general file access from the UI" },
    { crate = "tauri-plugin-http", reason = "the UI has no network access" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
