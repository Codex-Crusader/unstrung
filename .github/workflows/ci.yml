name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly audit, so new advisories show up without a code change.
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  NPM_ALLOWED_LICENSES: "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Zlib;0BSD;Apache-2.0 OR MIT;MIT OR Apache-2.0"

jobs:
  app:
    name: Build, lint and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # The app embeds ui/dist, so the UI must build before cargo.
      - name: Lint, check and build the UI
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p unstrung-app
      # Settings > Help > Open source licenses must match the dependencies.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2
      # cargo-about runs offline, so it needs the crates of every target.
      - name: The license page is up to date
        run: |
          cargo fetch --locked
          python -I tools/licenses.py --check

  fuzz:
    name: Fuzz the card parser (60 seconds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      # The seeds are in fuzz/corpus/card. New inputs that the run finds stay on the runner.
      # The prebuilt cargo-fuzz is a musl build, and it builds for its own
      # target unless told otherwise. The sanitizer needs the glibc target.
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu card -- -max_total_time=60 -max_len=65536

  cargo-deny:
    name: cargo deny (licenses, bans, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  npm:
    name: npm audit and licenses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npx --yes license-checker-rseidelsohn@5.0.1 --production --excludePrivatePackages --onlyAllow "$NPM_ALLOWED_LICENSES"
